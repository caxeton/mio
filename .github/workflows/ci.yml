name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
          POSTGRES_DB: devhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhub -d devhub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Aplica el esquema dos veces para comprobar que es idempotente.
      - run: npm run db:setup && npm run db:setup
        env:
          DATABASE_URL: postgres://devhub:devhub@localhost:5432/devhub
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
