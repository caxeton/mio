# Postgres local para desarrollo, equivalente al entorno "neon-local-postgres"
# documentado en el propio dashboard.
#
#   npm run db:up        # levanta el contenedor
#   npm run db:setup     # aplica sql/schema.sql
#
# Credenciales solo para desarrollo local; no reutilizar en producción.
services:
  db:
    image: postgres:16-alpine
    container_name: devhub-postgres
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub
      POSTGRES_DB: devhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devhub_pg:
